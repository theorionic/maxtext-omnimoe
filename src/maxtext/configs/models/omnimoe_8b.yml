# OmniMoE-8B — one-expert-per-chip variant for TPU v5e-8.
#
# Design goal (per request): ~8B total params, 8 experts of ~1B each, with
# expert_parallelism=8 so each of the 8 v5e chips physically holds exactly ONE
# expert. Routing is top-1 (num_experts_per_tok=1): the router picks one expert
# per token, the token is all-to-all'd to that expert's chip, and the expert
# forward/backward runs on that chip. Attention/embeddings are data-sharded over
# the same 8-way axis (activation_batch_attn includes 'expert').
#
# Per-expert params (all 16 layers): 16 * 3 * emb_dim * moe_mlp_dim
#   = 16 * 3 * 2048 * 10240 ≈ 1.006B  -> x8 experts ≈ 8.05B routed
#   + attention/embed/router ≈ 0.23B  -> ~8.28B total ("~8B").

# --- Backbone ---
base_emb_dim: 2048
base_num_query_heads: 16
base_num_kv_heads: 4            # 4:1 GQA
head_dim: 128
base_num_decoder_layers: 16
base_mlp_dim: 10240           # must equal base_moe_mlp_dim for a fully-MoE model
base_moe_mlp_dim: 10240        # expert inner dim -> ~1B params/expert across 16 layers
vocab_size: 32000
enable_dropout: false
logits_via_embedding: true      # tied LM head
normalization_layer_epsilon: 1.0e-6

# --- OmniMoE decoder block ---
decoder_block: "omnimoe"
omnimoe_full_causal_every_n: 4  # layer i % 4 == 0 -> full causal, rest sliding

# --- MoE: 8 experts, one per chip, top-1 routing ---
num_experts: 8
num_experts_per_tok: 1          # top-1: each token -> exactly one expert/chip
shared_experts: 0               # pure routed (no always-on dense expert)
mlp_activations: ["silu", "linear"]
mlp_activations_limit: 10.0
routed_score_func: "sqrtsoftplus"
routed_scaling_factor: 2.5
routed_bias: true
routed_bias_update_rate: 1.0e-4
load_balance_loss_weight: 0.001
norm_topk_prob: false
first_num_dense_layers: 0       # all 16 layers are MoE

# --- Attention ---
attention_type: "global"
use_qk_norm: true
sliding_window_size: 512

# --- RoPE (partial) ---
rope_type: "default"
rope_max_timescale: 1_000_000
partial_rotary_factor: 0.5
max_position_embeddings: 2048

# --- Optimization ---
opt_type: "adamw"
adam_weight_decay: 0.1
adam_b1: 0.9
adam_b2: 0.95
adam_eps: 1.0e-8
gradient_clipping_threshold: 1.0

# --- Training ---
# per_device_batch_size=2 x max_target_length=1024 x 8 chips = 16k tokens/step is the
# MFU sweet spot. The step is all-to-all-COMMUNICATION bound (top-1 one-expert-per-chip),
# and the dropless-MoE ragged buffers grow with tokens/step, so DOUBLING tokens/step does
# not help: bs=4 or seq=2048 pushes HBM toward the 15.75 GB limit and MFU falls, while
# bs=8 and seq=4096 OOM outright (benchmarked on v5e-8). Global batch = 2 * 8 = 16
# sequences/step; raise the EFFECTIVE batch via gradient_accumulation_steps (below),
# never via bs/seq.
per_device_batch_size: 2
# Gradient accumulation runs 8 microbatches of bs=2 (each at the MFU-optimal size)
# per optimizer step -> effective batch 2*8*8chips = 128 sequences, while amortizing
# the bandwidth-bound AdamW weight update over 8 microbatches. Measured 30.9 vs 30.2
# TFLOP/s/device (15.7% MFU), loss decreasing cleanly. Set to 1 to disable.
gradient_accumulation_steps: 8
max_target_length: 1024

# --- Sharding: 8 chips, one expert per chip ---
ici_fsdp_parallelism: 1
ici_tensor_parallelism: 1
ici_expert_parallelism: 8       # 8 experts / 8 chips = 1 expert per chip
ici_data_parallelism: 1
scan_layers: false
# remat_policy=full is optimal AND the fastest numerically-stable policy at the
# production gradient_accumulation_steps=8. Benchmarked on v5e-8 (synthetic data,
# steady state; v5e bf16 peak 197 TFLOP/s/device):
#   full                  -> 30.9 TFLOP/s (15.7% MFU), 13.3 GB HBM   <- best & stable
#   save_dot_except_mlp   -> 30.7 TFLOP/s (15.6%), stable but NO gain
#   save_qkv_proj         -> 30.9 TFLOP/s (15.7%), NO gain
#   save_dot_except_mlpwi -> DIVERGES TO NaN at accum=8 (reproduced twice); do NOT use
# (save_dot_except_mlpwi looks ~2x faster at accum=1, but that is an accum=1-only
# artifact: at the real accum=8 it aborts on NaN loss.) The step is all-to-all
# COMMUNICATION bound, not HBM-bandwidth bound: with top-1 one-expert-per-chip every
# token is dispatched to its expert's chip and combined back. full remat is cheap
# here precisely because it recomputes those (cheap) activations instead of paying
# extra HBM to keep them, and it never re-runs the expensive all-to-all in backward.
remat_policy: "full"
weight_dtype: "bfloat16"        # keeps weights+mu+nu at 2B each so a 1B expert fits per chip
