# OmniMoE — SOTA MoE combining DeepSeek-V4 routing, Qwen3.6 attention geometry,
# and a custom hybrid full/sliding attention pattern.
# This config targets an 8-core TPU v5e (v5lite) for MFU benchmarking.

# --- Backbone ---
base_emb_dim: 1024
base_num_query_heads: 16
base_num_kv_heads: 2            # 8:1 GQA (Qwen3.6 style)
head_dim: 128
base_num_decoder_layers: 12
base_mlp_dim: 2816              # dense FFN (first 3 layers)
base_moe_mlp_dim: 512           # fine-grained expert inner
vocab_size: 32000
enable_dropout: false
logits_via_embedding: true      # tied LM head
normalization_layer_epsilon: 1.0e-6

# --- OmniMoE decoder block ---
decoder_block: "omnimoe"
omnimoe_full_causal_every_n: 4  # layer i % 4 == 0 -> full causal, rest sliding

# --- MoE (DeepSeek-V4 routing) ---
num_experts: 64
num_experts_per_tok: 8
shared_experts: 1
mlp_activations: ["silu", "linear"]
mlp_activations_limit: 10.0     # SwiGLU clamping (DeepSeek-V4 §4.2.3)
routed_score_func: "sqrtsoftplus"  # sqrt(softplus(w·x)) affinity (DeepSeek-V4)
routed_scaling_factor: 2.5
routed_bias: true               # noaux_tc bias tempering
routed_bias_update_rate: 1.0e-4
load_balance_loss_weight: 0.001
norm_topk_prob: false           # V4 style: raw affinities, no softmax renorm
first_num_dense_layers: 3       # first 3 layers dense, rest MoE

# --- Attention ---
attention_type: "global"        # per-layer override via get_attention_type()
use_qk_norm: true               # QK-RMSNorm (Qwen3.6 style)
sliding_window_size: 512

# --- RoPE (partial, Qwen3.6 style) ---
rope_type: "default"
rope_max_timescale: 1_000_000
partial_rotary_factor: 0.5      # rotate 64/128 dims
max_position_embeddings: 2048

# --- Optimization ---
opt_type: "adamw"
adam_weight_decay: 0.1
adam_b1: 0.9
adam_b2: 0.95
adam_eps: 1.0e-8
gradient_clipping_threshold: 1.0

# --- Training ---
per_device_batch_size: 64
max_target_length: 1024

# --- Sharding (8 cores, FSDP) ---
ici_fsdp_parallelism: 8
ici_tensor_parallelism: 1
ici_expert_parallelism: 1
ici_data_parallelism: 1
scan_layers: false
remat_policy: "minimal"
weight_dtype: "bfloat16"